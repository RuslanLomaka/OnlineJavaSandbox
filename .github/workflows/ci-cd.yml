name: CI/CD

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: online-java-production
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: online_java
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d online_java"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Editor autocomplete logic (static/js/editor/java-completions.js).
      # Uses Node's built-in test runner: no npm install, no dependencies.
      - name: JavaScript unit tests
        run: node --test 'src/test/js/**/*.test.mjs'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Checkstyle
        id: checkstyle
        continue-on-error: true
        run: ./mvnw -B -ntp checkstyle:check

      - name: Report Checkstyle violations
        if: always()
        uses: jwgmeligmeyling/checkstyle-github-action@v1
        with:
          path: '**/checkstyle-report.xml'

      - name: Fail if Checkstyle failed
        if: steps.checkstyle.outcome == 'failure'
        run: exit 1

      - name: Run tests
        env:
          GITHUB_CLIENT_ID: test-client-id
          GITHUB_CLIENT_SECRET: test-client-secret
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/online_java
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: ./mvnw clean verify

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Configure SSH
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_HOST: ${{ secrets.PI_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > ~/.ssh/online_java_deploy
          chmod 600 ~/.ssh/online_java_deploy

          ssh-keyscan -H "$PI_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          ssh -i ~/.ssh/online_java_deploy "$PI_USER@$PI_HOST" '
            set -e

            cd ~/projects/OnlineJavaSandbox

            git fetch origin master
            git reset --hard origin/master

            docker compose up -d --build

            docker image prune -f

            docker compose ps

            # "Container started" is not "site works": wait until the app
            # actually answers on port 8080, otherwise fail the deploy.
            for attempt in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
                echo "App is up (HTTP $code)"
                exit 0
              fi
              sleep 5
            done
            echo "App did not respond on port 8080 within 150s."
            echo "Check it on the Pi with: docker compose logs --tail=100 app"
            exit 1
          '