spring.application.name=OnlineJava
# Fail safe: without an explicit profile the app runs as production (login
# required). Local development activates "dev" explicitly (see readme).
spring.profiles.default=prod

server.forward-headers-strategy=framework
logging.pattern.correlation=[%X{correlationId:-}]

# Schema is managed by Flyway in every profile; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate

# Databases that existed before Flyway (like production) have tables but no
# flyway_schema_history, which makes Flyway refuse to start. Baseline them at
# version 0 so V1 onwards still run. No effect on empty or already-migrated DBs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false

# Screenshot uploads: hard cap enforced before the request reaches a controller.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Error responses as RFC 9457 problem+json.
spring.mvc.problemdetails.enabled=true

# Never expose stack traces or exception messages in HTTP error responses.
server.error.include-stacktrace=never
server.error.include-message=never
