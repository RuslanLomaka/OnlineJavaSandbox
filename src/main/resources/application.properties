spring.application.name=OnlineJava
spring.profiles.default=dev

server.forward-headers-strategy=framework
logging.pattern.correlation=[%X{correlationId:-}]

# Schema is managed by Flyway in every profile; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Screenshot uploads: hard cap enforced before the request reaches a controller.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Error responses as RFC 9457 problem+json.
spring.mvc.problemdetails.enabled=true
