<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Java Sandbox</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #151515;
            color: #eeeeee;
            font-family: Consolas, monospace;
        }

        .navbar {
            height: 60px;
            padding: 0 30px;
            background: #20242b;
            border-bottom: 1px solid #414650;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-left,
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .navbar a {
            color: #eeeeee;
            text-decoration: none;
        }

        .navbar .logo {
            font-size: 19px;
            font-weight: bold;
        }

        .navbar button {
            margin: 0;
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            background: #b83a3a;
            color: white;
            font-family: inherit;
            cursor: pointer;
        }

        .container {
            width: min(1100px, 94%);
            margin: 30px auto;
        }

        .editor-wrapper {
            border: 1px solid #555;
        }

        .CodeMirror {
            height: 430px;
            font-family: Consolas, monospace;
            font-size: 16px;
            line-height: 1.5;
        }

        .CodeMirror-focused {
            outline: 1px solid #777;
        }

        #runButton {
            margin-top: 14px;
            padding: 11px 24px;

            border: none;
            border-radius: 5px;

            background: #238636;
            color: white;

            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
        }

        #runButton:hover {
            background: #2ea043;
        }

        #runButton:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #console {
            min-height: 180px;
            padding: 16px;

            background: #000000;
            color: #62ff62;
            border: 1px solid #444;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">

    <h1>Java Sandbox</h1>

    <div class="editor-wrapper">
        <textarea id="code">import java.util.*;

public class Main {

    public static void main(String[] args) {
        System.out.println("Hello from the sandbox!");
    }
}</textarea>
    </div>

    <button id="runButton" type="button">
        Run
    </button>

    <h2>Console</h2>

    <pre id="console">Waiting...</pre>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>

<script>
    const javaWords = [
        "abstract",
        "boolean",
        "break",
        "byte",
        "case",
        "catch",
        "char",
        "class",
        "continue",
        "default",
        "do",
        "double",
        "else",
        "enum",
        "extends",
        "false",
        "final",
        "finally",
        "float",
        "for",
        "if",
        "implements",
        "import",
        "instanceof",
        "int",
        "interface",
        "long",
        "new",
        "null",
        "package",
        "private",
        "protected",
        "public",
        "return",
        "short",
        "static",
        "super",
        "switch",
        "this",
        "throw",
        "throws",
        "true",
        "try",
        "void",
        "while",

        "String",
        "Integer",
        "Long",
        "Double",
        "Boolean",
        "Character",
        "Object",
        "Math",
        "System",
        "StringBuilder",
        "Scanner",

        "List",
        "ArrayList",
        "LinkedList",
        "Set",
        "HashSet",
        "Map",
        "HashMap",
        "Queue",
        "Deque",
        "Arrays",
        "Collections",

        "System.out.print",
        "System.out.println"
    ];

    const snippets = {
        sout: "System.out.println();",

        main:
            `public static void main(String[] args) {

}`,

        for:
            `for (int i = 0; i < 10; i++) {

}`,

        foreach:
            `for (var item : collection) {

}`,

        while:
            `while (condition) {

}`,

        if:
            `if (condition) {

}`,

        ifelse:
            `if (condition) {

} else {

}`,

        trycatch:
            `try {

} catch (Exception exception) {
    exception.printStackTrace();
}`
    };


    const editor = CodeMirror.fromTextArea(
        document.getElementById("code"),
        {
            mode: "text/x-java",
            theme: "material-darker",

            lineNumbers: true,
            lineWrapping: true,

            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,

            autoCloseBrackets: true,
            matchBrackets: true,

            extraKeys: {
                "Ctrl-Space": showAutocomplete,
                "Cmd-Space": showAutocomplete,

                "Ctrl-Enter": runCode,
                "Cmd-Enter": runCode,

                "Tab": function (codeMirror) {
                    if (codeMirror.somethingSelected()) {
                        codeMirror.indentSelection("add");
                    } else {
                        codeMirror.replaceSelection("    ", "end");
                    }
                }
            }
        }
    );


    function findDeclaredVariables() {
        const code = editor.getValue();

        const variablePattern =
            /\b(?:int|long|double|float|boolean|char|byte|short|String|Integer|Long|Double|Boolean|Character|Object|StringBuilder|List|ArrayList|LinkedList|Map|HashMap|Set|HashSet|Queue|Deque)\s*(?:<[^;=]+>)?\s+([a-zA-Z_$][\w$]*)/g;

        const variables = [];
        const names = new Set();

        for (const match of code.matchAll(variablePattern)) {
            const variableName = match[1];

            if (!names.has(variableName)) {
                names.add(variableName);
                variables.push(variableName);
            }
        }

        return variables;
    }


    function getCurrentWord() {
        const cursor = editor.getCursor();
        const line = editor.getLine(cursor.line);

        let start = cursor.ch;
        let end = cursor.ch;

        while (
            start > 0 &&
            /[\w.$]/.test(line.charAt(start - 1))
            ) {
            start--;
        }

        while (
            end < line.length &&
            /[\w.$]/.test(line.charAt(end))
            ) {
            end++;
        }

        return {
            word: line.slice(start, end),
            from: CodeMirror.Pos(cursor.line, start),
            to: CodeMirror.Pos(cursor.line, end)
        };
    }


    function showAutocomplete() {
        const current = getCurrentWord();

        const suggestions = [
            ...Object.keys(snippets),
            ...findDeclaredVariables(),
            ...javaWords
        ];

        const uniqueSuggestions =
            [...new Set(suggestions)];

        const filteredSuggestions =
            uniqueSuggestions
                .filter(item =>
                    item.toLowerCase().startsWith(
                        current.word.toLowerCase()
                    )
                )
                .map(item => ({
                    text: snippets[item] ?? item,
                    displayText: item
                }));

        if (filteredSuggestions.length === 0) {
            return;
        }

        editor.showHint({
            hint: function () {
                return {
                    list: filteredSuggestions,
                    from: current.from,
                    to: current.to
                };
            },

            completeSingle: false
        });
    }


    editor.on("inputRead", function (codeMirror, change) {
        if (
            change.text.length === 1 &&
            /^[a-zA-Z.]$/.test(change.text[0])
        ) {
            showAutocomplete();
        }
    });


    const runButton =
        document.getElementById("runButton");

    const consoleOutput =
        document.getElementById("console");


    async function runCode() {
        runButton.disabled = true;
        consoleOutput.textContent = "Compiling...\n";

        try {
            const response = await fetch("/sandbox/run", {
                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=UTF-8"
                },

                body: editor.getValue()
            });

            consoleOutput.textContent =
                await response.text();

        } catch (error) {
            consoleOutput.textContent =
                "Request failed:\n" + error.message;

        } finally {
            runButton.disabled = false;
        }
    }


    runButton.addEventListener("click", runCode);

    editor.focus();
</script>

</body>
</html>
