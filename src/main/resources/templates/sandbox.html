<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/head :: pwa}"></th:block>

    <title>Java Sandbox</title>

    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/editor.css}">
    <link rel="stylesheet" th:href="@{/css/sandbox.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">

    <h1>Java Sandbox</h1>

    <!-- Monaco editor mounts here (see /js/editor/java-editor.js). -->
    <div id="editor" class="code-editor sandbox-editor">
        <p class="editor-loading">Loading editor…</p>
    </div>
    <div id="editorStatus" class="editor-status"></div>

    <div class="editor-toolbar-buttons">
        <button id="runButton" type="button" class="editor-button primary">Run</button>
        <button id="formatButton" type="button" class="editor-button">Format</button>
        <button id="resetButton" type="button" class="editor-button">Reset</button>
    </div>

    <!-- Terminal-style output (coloured by /js/console-output.js). -->
    <section class="terminal" aria-label="Console">
        <div class="terminal-header">
            <span class="terminal-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="terminal-title">Console</span>
            <span id="consoleStatus" class="terminal-status"></span>
        </div>
        <pre id="console" class="terminal-body" aria-live="polite"><span class="console-line console-meta">Waiting...</span></pre>
    </section>

</main>

<!-- Monaco's AMD loader (vendored; see scripts/vendor-monaco.sh). -->
<script th:src="@{/vendor/monaco-editor-0.56.0/min/vs/loader.js}"></script>
<script type="module" th:src="@{/js/sandbox.js}"></script>

</body>
</html>
