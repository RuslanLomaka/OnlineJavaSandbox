<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${problem.title}">Problem</title>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">

    <div class="problem-layout">

        <section class="problem-description">

            <!-- Displays the problem difficulty from the Problem object. -->
            <span th:text="${problem.difficulty}"></span>

            <!-- Displays the problem category from the Problem object. -->
            <span th:text="${problem.category}"></span>

            <!-- Displays the problem type from the Problem object. -->
            <span th:text="${problem.type}"></span>

            <!-- Displays the problem title from the Problem object. -->
            <h1 th:text="${problem.title}"></h1>

            <!-- Displays the problem description from the Problem object. -->
            <p th:text="${problem.description}"></p>

            <p>
                Your method must sort the original array in
                ascending order.
            </p>

            <h2>Requirements</h2>

            <ul>
                <li th:each="requirement : ${problem.requirements}"
                    th:text="${requirement}">
                </li>
            </ul>

            <h2>Examples</h2>

            <div th:each="example : ${problem.examples}"
                 th:text="${example}"
                 class="example">
            </div>
            <button id="hintButton" type="button">
                Show Hint
            </button>

            <p id="hintText"
               th:text="${problem.hint}"
               style="display: none;">
            </p>

        </section>

        <section class="solution-area">

            <h2>Write your solution here</h2>

            <!-- Displays the method signature required for the problem. -->
            <p class="method-signature"
               th:text="${problem.methodSignature}">
            </p>

            <div class="editor-wrapper">

                <!-- Displays the starter code provided by the problem. -->
                <textarea id="solutionCode"
                          th:text="${problem.starterCode}"></textarea>

            </div>

            <p class="method-signature">}</p>

            <button id="runTestsButton"
                    type="button">
                Run tests
            </button>

            <h2>Test results</h2>

            <pre id="testConsole">Waiting for your solution...</pre>

        </section>

    </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

<script th:src="@{/js/bubble-sort.js}"></script>
<script th:src="@{/js/problem.js}"></script>

</body>

</html>
