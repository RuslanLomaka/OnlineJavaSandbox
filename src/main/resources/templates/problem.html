<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/csrf :: meta}"></th:block>

    <!-- Loads the common site styling. -->
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/editor.css}">

    <!-- Loads the generic problem-page styling. -->
    <link rel="stylesheet"
          th:href="@{/css/problem.css}">

    <title th:text="${problem.title}">Problem</title>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Stores the current problem slug for the problem-page JavaScript. -->
<main class="container"
      th:attr="data-problem-slug=${problem.slug}">

    <div class="problem-layout">

        <!-- ==================== LEFT: PROBLEM ==================== -->
        <section class="problem-description">

            <!-- Displays problem metadata. -->
            <div class="problem-meta">
                <span th:text="${problem.difficulty}"></span>
                <a th:href="@{${problem.topic.path()}}"
                   th:text="${problem.topic.section().title()} + ' › ' + ${problem.topic.title()}">Topic</a>
            </div>

            <!-- Displays the problem title. -->
            <h1 th:text="${problem.title}"></h1>

            <!-- Link to the problem's discussion; problem.js adds the post count. -->
            <a id="discussionLink"
               class="discussion-link"
               th:href="@{${problem.path} + '/discussion'}">
                💬 Discussion
            </a>

            <!-- Displays the problem description. -->
            <p th:text="${problem.description}"></p>

            <h2>Requirements</h2>

            <!-- Displays all problem requirements. -->
            <ul>
                <li th:each="requirement : ${problem.requirements}"
                    th:text="${requirement}">
                </li>
            </ul>

            <h2>Examples</h2>

            <!-- Displays each problem example as a separate card. -->
            <div class="examples-container">

                <div th:each="example, stat : ${problem.examples}"
                     class="example">

                    <div class="example-title"
                         th:text="'Example ' + ${stat.count}">
                    </div>

                    <div class="example-content"
                         th:text="${example}">
                    </div>

                </div>

            </div>

            <!-- Shows the hint only when clicked. -->
            <button id="hintButton"
                    type="button">
                Show Hint
            </button>

            <!-- Displays the problem hint. -->
            <p id="hintText"
               th:text="${problem.hint}"
               style="display: none;">
            </p>

        </section>


        <!-- ==================== RIGHT: CODE EDITOR ==================== -->
        <section class="solution-area">

            <!-- Displays the Java version used by the editor. -->
            <div class="editor-toolbar">

                <div class="language-selector">
                    <span>Java</span>
                    <span class="language-version">(21)</span>
                </div>

            </div>

            <!-- Displays the method signature required for the problem. -->
            <div class="method-header">
                <span th:text="${problem.methodSignature}"></span>
                <span class="method-opening-brace">{</span>
            </div>

            <!-- Monaco editor for the method body (see /js/editor/java-editor.js). -->
            <div id="solutionEditor"
                 class="code-editor problem-editor"
                 th:attr="data-starter-code=${problem.starterCode}">
                <p class="editor-loading">Loading editor…</p>
            </div>
            <div id="editorStatus" class="editor-status"></div>

            <!-- Execution controls. -->
            <div class="execution-bar">

                <button id="runTestsButton"
                        type="button"
                        class="run-tests-button">
                    Run Tests
                </button>

                <button id="formatButton"
                        type="button"
                        class="editor-button">
                    Format
                </button>

            </div>

            <!-- Test result panel. -->
            <div class="test-panel">

                <div class="test-panel-header">
                    <span>Test Results</span>
                </div>

                <pre id="testConsole">Waiting for your solution...</pre>

            </div>

        </section>

    </div>

</main>


<!-- Monaco's AMD loader (vendored; see scripts/vendor-monaco.sh). -->
<script th:src="@{/vendor/monaco-editor-0.56.0/min/vs/loader.js}"></script>

<!-- Supplies csrfHeaders() for the Run Tests request. -->
<script th:src="@{/js/csrf.js}"></script>

<!-- Generic problem-page JavaScript. -->
<script type="module" th:src="@{/js/problem.js}"></script>

</body>
</html>
