<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Array Problems | Online Java</title>

    <link rel="stylesheet"
          th:href="@{/css/site.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">

    <h1 class="page-title">
        Arrays
    </h1>

    <p class="page-description">
        Problems involving array traversal,
        sorting, searching and modification.
    </p>

    <h2>Sorting</h2>

    <div class="problem-list">

        <!-- Displays array sorting problems. -->
        <a th:each="problem : ${problems}"
           th:if="${problem.type.name() == 'SORTING'}"
           class="problem-link"
           th:href="@{'/problems/arrays/' + ${problem.slug}}">

            <span th:text="${problem.title}">
                Problem
            </span>

            <span class="problem-difficulty"
                  th:text="${problem.difficulty}">
                Easy
            </span>

        </a>

        <div th:if="${#lists.isEmpty(problems.?[type.name() == 'SORTING'])}"
             class="empty-section">
            No sorting problems yet.
        </div>

    </div>

    <h2>Searching</h2>

    <div class="problem-list">

        <!-- Displays array searching problems. -->
        <a th:each="problem : ${problems}"
           th:if="${problem.type.name() == 'SEARCHING'}"
           class="problem-link"
           th:href="@{'/problems/arrays/' + ${problem.slug}}">

            <span th:text="${problem.title}">
                Problem
            </span>

            <span class="problem-difficulty"
                  th:text="${problem.difficulty}">
                Easy
            </span>

        </a>

        <div th:if="${#lists.isEmpty(problems.?[type.name() == 'SEARCHING'])}"
             class="empty-section">
            No searching problems yet.
        </div>

    </div>

    <h2>Hashing</h2>

    <div class="problem-list">

        <!-- Displays array hashing problems. -->
        <a th:each="problem : ${problems}"
           th:if="${problem.type.name() == 'HASHING'}"
           class="problem-link"
           th:href="@{'/problems/arrays/' + ${problem.slug}}">

            <span th:text="${problem.title}">
                Problem
            </span>

            <span class="problem-difficulty"
                  th:text="${problem.difficulty}">
                Easy
            </span>

        </a>

        <div th:if="${#lists.isEmpty(problems.?[type.name() == 'HASHING'])}"
             class="empty-section">
            No hashing problems yet.
        </div>

    </div>

</main>

</body>
</html>
