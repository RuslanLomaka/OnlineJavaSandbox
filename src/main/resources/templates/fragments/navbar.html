<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!--
    Shared navbar. The "Data Structures" and "Algorithms" menus come from
    navSections (NavigationModelAdvice). They are <details> elements, so they
    open and close without JavaScript; /js/nav.js only adds "close on outside
    click / Escape".
-->
<nav th:fragment="navbar"
     class="navbar"
     aria-label="Main">

    <div class="navbar-left">

        <a th:href="@{/}"
           class="logo">
            Online Java
        </a>

        <!--
            Mobile-only hamburger toggle: reveals the rest of the navbar
            (hidden under 850px, see site.css) without JavaScript. The
            ":has()" selector in site.css shows/hides based on [open].
        -->
        <details class="navbar-toggle">
            <summary class="navbar-toggle-summary"
                     aria-label="Menu">&#9776;</summary>
        </details>

        <!--
            Collapsed under the navbar-toggle on mobile (site.css); flows
            inline as before on desktop, where the toggle is hidden.
        -->
        <div class="navbar-links">

            <a th:href="@{/sandbox}">
                Sandbox
            </a>

            <details class="nav-menu"
                     th:each="section : ${navSections}">

                <summary th:text="${section.title}">Data Structures</summary>

                <ul class="nav-menu-list">
                    <li th:each="topic : ${section.topics}">
                        <a th:href="@{${topic.path}}"
                           th:classappend="${topic.problemCount == 0} ? 'nav-topic-empty'">
                            <span th:text="${topic.title}">Topic</span>
                            <span class="nav-count"
                                  th:text="${topic.problemCount == 0} ? 'soon' : ${topic.problemCount}">1</span>
                        </a>
                    </li>
                </ul>

            </details>

            <a th:href="@{/problems}">
                All problems
            </a>

        </div>

    </div>

    <div class="navbar-right">

        <span th:if="${username != null}">
            Logged in as
            <strong th:text="${username}">
                GitHub user
            </strong>
        </span>

        <form th:if="${username != null}"
              th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="logout-button">
                Log out
            </button>

        </form>

    </div>

    <script th:src="@{/js/nav.js}" defer></script>

</nav>

</body>
</html>
