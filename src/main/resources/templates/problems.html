<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/head :: pwa}"></th:block>

    <title>Problems | Online Java</title>

    <link rel="stylesheet"
          th:href="@{/css/site.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">

    <h1 class="page-title">Java Problems</h1>

    <p class="page-description">
        Practise Java by topic. Problems are grouped by the data structure they
        use or the algorithm they teach, easiest first.
    </p>

    <!-- One block per section: Data Structures, then Algorithms. -->
    <section class="problem-section"
             th:each="section : ${sections}"
             th:attr="aria-label=${section.title}">

        <h2 class="section-title" th:text="${section.title}">Data Structures</h2>

        <div class="section-grid">
            <article class="section-card"
                     th:each="view : ${section.topics}"
                     th:classappend="${#lists.isEmpty(view.problems)} ? 'section-card-empty'">
                <h3>
                    <a th:href="@{${view.topic.path()}}"
                       th:text="${view.topic.title()}">Topic</a>
                </h3>
                <p th:text="${view.topic.description()}">Description</p>
                <th:block th:replace="~{fragments/problem-list :: problemList(${view.problems})}"></th:block>
            </article>
        </div>

    </section>

</main>

</body>
</html>
