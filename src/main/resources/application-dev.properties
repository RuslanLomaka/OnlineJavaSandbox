spring.config.import=optional:file:.env[.properties]

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
server.address=127.0.0.1

sandbox.root=${user.home}/.online-java/runs
sandbox.no-new-privileges=false
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Local PostgreSQL for discussions and users. Defaults match a plain
# `docker run -p 127.0.0.1:5432:5432 -e POSTGRES_DB=online_java postgres`;
# override with DEV_DATASOURCE_URL / POSTGRES_USER / POSTGRES_PASSWORD.
spring.datasource.url=${DEV_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/online_java}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
